name: Community Bot Posts

on:
  schedule:
    # Pool operating hours only (SGT 07:00-21:30 == UTC 23:00-13:30).
    # The app-side scheduler is the source of truth and also skips ticks
    # outside the (buffered) operating window; this schedule just avoids
    # burning Actions minutes overnight. GitHub cron is UTC.
    - cron: "*/30 23 * * *"
    - cron: "*/30 0-13 * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call community bot cron endpoint
        env:
          COMMUNITY_BOT_CRON_URL: ${{ secrets.COMMUNITY_BOT_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$COMMUNITY_BOT_CRON_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --max-time 25 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$COMMUNITY_BOT_CRON_URL"
